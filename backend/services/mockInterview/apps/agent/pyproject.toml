[project]
name = "deepinterview-agent"
version = "0.3.0"
description = "DeepInterview live voice interviewer + prep/post pipelines (WP-0 shell)."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "fastapi>=0.140",
    "uvicorn>=0.51",
    "httpx>=0.28",
    "pydantic-settings>=2.14",
    "langgraph>=1.2",
    "langchain-core>=1.5",
    # Server-side CV/résumé document parsing (PDF/DOCX -> text). Core, not
    # optional: an uploaded CV is useless until it's converted to text.
    "markitdown[pdf,docx]>=0.1.6",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.14"]
openai = ["openai>=2.48"]
dashscope = [
    "openai>=2.48",
    "websockets>=15",
    "livekit-agents>=1.6",
    "livekit-plugins-openai>=1.6",
    "livekit-plugins-silero>=1.6",
]
supabase = ["supabase>=2.31"]
tavily = ["tavily-python>=0.7"]
# Live voice loop (WP-5) — heavy; install with: uv sync --extra livekit.
# livekit-agents 1.6.x + the cascaded STT->LLM->TTS plugin set the worker needs:
#   silero (VAD) · deepgram (STT) · cartesia + elevenlabs (TTS) · google (Gemini
#   live LLM) · openai. 1.6+ is required for Gemini 3 thought-signature replay
#   on function calls. ElevenLabs Flash v2.5 is the low-latency voice for
#   languages Cartesia can't speak (e.g. Vietnamese).
livekit = [
    "livekit-agents>=1.6",
    "livekit-plugins-silero>=1.6",
    "livekit-plugins-deepgram>=1.6",
    "livekit-plugins-cartesia>=1.6",
    "livekit-plugins-elevenlabs>=1.6",
    "livekit-plugins-google>=1.6",
    "livekit-plugins-openai>=1.6",
    # Noisy-environment robustness: BVC noise cancellation (LiveKit Cloud) so
    # background noise can't hold the turn open, + the semantic end-of-turn
    # model so "is the candidate done?" is judged from the transcript, not
    # just silence. Model weights are baked into the worker image (Dockerfile).
    "livekit-plugins-noise-cancellation>=0.3",
    "livekit-plugins-turn-detector>=1.6",
]
# Observability (WP-12) — gated tracing/error reporting. NOT installed by
# default; core/observability.py no-ops without these. Enable with:
#   uv sync --extra observability   (then set SENTRY_DSN / LANGFUSE_* keys)
observability = [
    "sentry-sdk>=2.62",
    "langfuse>=4.7",
]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepinterview_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
